{% extends "base.html" %}
{% block title %}Modifier mon mot de passe · Usine HA{% endblock %}
{% block content %}
<section class="page-heading"><div><p class="eyebrow">Compte</p><h1>Modifier mon mot de passe</h1><p class="subtitle">Choisissez un nouveau mot de passe pour sécuriser votre accès.</p></div></section>
<section class="panel form-panel"><form method="post" class="model-form">{% csrf_token %}{{ form.as_p }}<div class="form-actions"><a class="secondary-button" href="{% url 'dashboard' %}">Annuler</a><button class="primary-button" type="submit">Enregistrer</button></div></form></section>
{% endblock %}
